<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Lir reads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  /* Lir design tokens, copied from lir-design-system/tokens/tokens.css (2026-10-30).
     Dark is the default. Light follows the OS, or force a theme with ?theme=light / ?theme=dark. */
  :root {
    --bg-surface: #25292d;
    --bg-subtle: #30353a;
    --border-default: #394149;
    --border-strong: #5a646d;
    --text-primary: #f2f4fa;
    --text-secondary: #cde6e9;
    --text-muted: #8c979f;
    --text-on-accent: #000000;
    --accent-primary: #ebff8b;
    --accent-primary-bg: #3a4120;

    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-6: 24px; --space-8: 32px; --space-12: 48px;
    --radius-md: 8px; --radius-lg: 12px; --radius-xl: 20px; --radius-full: 999px;

    --font-family: "Mori", "DM Sans", system-ui, sans-serif;
    --ease-ui: cubic-bezier(0.23, 1, 0.32, 1);
    --duration-fast: 150ms;
    --duration-base: 250ms;

    /* Selected line: lime on dark; lime has no contrast on white, so Light uses border/strong. */
    --selected-line: var(--accent-primary);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-surface: #ffffff;
      --bg-subtle: #e1f3e6;
      --border-default: #cde6e9;
      --border-strong: #394149;
      --text-primary: #000000;
      --text-secondary: #394149;
      --text-muted: #5f6a73;
      --accent-primary-bg: #ebff8b;
      --selected-line: var(--border-strong);
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg-surface: #ffffff;
    --bg-subtle: #e1f3e6;
    --border-default: #cde6e9;
    --border-strong: #394149;
    --text-primary: #000000;
    --text-secondary: #394149;
    --text-muted: #5f6a73;
    --accent-primary-bg: #ebff8b;
    --selected-line: var(--border-strong);
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  /* Transparent so the widget sits on the Notion page in either Notion theme. */
  html, body { margin: 0; background: transparent; color: var(--text-primary); }
  body {
    font-family: var(--font-family);
    font: 400 14px/20px var(--font-family); /* Body/Default */
    padding: var(--space-6) var(--space-4);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  /* Label/Default */
  .label { font: 500 12px/16px var(--font-family); letter-spacing: .2px; color: var(--text-muted); }

  .heads, .graph { display: grid; grid-template-columns: 1fr 1.05fr 1fr; column-gap: clamp(32px, 7vw, 96px); }
  .heads { margin-bottom: var(--space-3); }
  .heads span:nth-child(2) { text-align: center; }
  .graph { position: relative; align-items: center; }

  .wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .wires path {
    fill: none; stroke: var(--border-default); stroke-width: 1;
    transition: stroke var(--duration-base) var(--ease-ui), stroke-width var(--duration-base) var(--ease-ui);
  }
  .wires path.dashed { stroke-dasharray: 4 4; }
  .wires path.feed { stroke: var(--border-strong); }
  .wires path.on { stroke: var(--selected-line); stroke-width: 2; }

  .col { display: flex; flex-direction: column; gap: var(--space-2); position: relative; z-index: 1; }

  /* Sensor cards */
  .src {
    all: unset; box-sizing: border-box; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    min-height: 44px; padding: var(--space-3) 14px; border-radius: var(--radius-lg);
    background: var(--bg-surface); border: 1px solid var(--border-default);
    transition: border-color var(--duration-fast) var(--ease-ui), background var(--duration-fast) var(--ease-ui);
  }
  .src:hover { border-color: var(--border-strong); }
  .src:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 2px; }
  .src[aria-pressed="true"] {
    background: var(--accent-primary-bg); border-color: var(--selected-line);
    box-shadow: inset 3px 0 0 var(--selected-line);
  }
  .src.later { background: transparent; border-style: dashed; }
  .src.later[aria-pressed="true"] { background: var(--accent-primary-bg); }
  .src b { display: block; font: 500 15px/20px var(--font-family); color: var(--text-primary); } /* Heading/H3 */
  .src small { display: block; font: 400 12px/16px var(--font-family); color: var(--text-muted); margin-top: 2px; } /* Body/Small */
  .src[aria-pressed="true"] small { color: var(--text-secondary); }

  .tag {
    flex: none; white-space: nowrap;
    font: 500 12px/16px var(--font-family); letter-spacing: .2px; color: var(--text-muted);
  }
  .src.lir .tag {
    padding: 2px var(--space-2); border-radius: var(--radius-full);
    background: var(--bg-subtle); color: var(--text-secondary);
  }
  .src.lir[aria-pressed="true"] .tag { background: var(--bg-surface); }

  /* Lir hub */
  .core {
    position: relative; z-index: 1;
    background: var(--bg-subtle); color: var(--text-primary);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-xl); padding: var(--space-6) var(--space-6) 20px;
  }
  .core h2 { margin: 0; text-align: center; font: 300 40px/44px var(--font-family); letter-spacing: -1px; } /* Display */
  .core p.sub { margin: var(--space-1) 0 20px; text-align: center; font: 400 12px/16px var(--font-family); color: var(--text-muted); }
  .rows { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .rows li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 10px; border-radius: var(--radius-md); background: var(--bg-surface);
    font: 400 13px/16px var(--font-family); color: var(--text-secondary);
    transition: background var(--duration-base) var(--ease-ui), color var(--duration-base) var(--ease-ui);
  }
  .rows li.later { background: transparent; outline: 1px dashed var(--border-strong); outline-offset: -1px; color: var(--text-muted); }
  .rows li.on { background: var(--accent-primary); color: var(--text-on-accent); font-weight: 500; outline: 0; }
  .core .foot { margin: var(--space-4) 0 0; text-align: center; font: 400 12px/16px var(--font-family); color: var(--text-muted); }

  /* What your team gets */
  .out {
    padding: var(--space-3) 14px; border-radius: var(--radius-lg);
    background: var(--bg-surface); border: 1px solid var(--border-default);
  }
  .out b { display: block; font: 500 15px/20px var(--font-family); }
  .out small { display: block; font: 400 12px/16px var(--font-family); color: var(--text-muted); margin-top: 2px; }

  /* Detail panel */
  .panel {
    margin-top: var(--space-6); padding: var(--space-4) 18px; border-radius: var(--radius-xl);
    border: 1px solid var(--border-default); background: var(--bg-surface);
    display: grid; grid-template-columns: minmax(150px, .8fr) 1fr 1fr; gap: 6px var(--space-6); min-height: 104px;
  }
  .panel h3 { margin: 0; font: 500 18px/24px var(--font-family); letter-spacing: -.2px; } /* Heading/H2 */
  .panel .kind { margin-top: 2px; }
  .panel h4 { margin: 0 0 var(--space-1); font: 500 12px/16px var(--font-family); letter-spacing: .2px; color: var(--text-muted); }
  .panel p { margin: 0; color: var(--text-secondary); }
  .hint { margin: 10px 0 0; text-align: center; font: 400 12px/16px var(--font-family); color: var(--text-muted); }

  /* Narrow: Notion side column, phones */
  .graph.v { grid-template-columns: 1fr; row-gap: var(--space-12); }
  .heads.v { display: none; }
  .graph.v .col { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-2); }
  .graph.v .col::before {
    content: attr(data-label); grid-column: 1 / -1;
    font: 500 12px/16px var(--font-family); letter-spacing: .2px; color: var(--text-muted);
  }
  .graph.v .src { flex-direction: column; align-items: flex-start; gap: 6px; }
  .graph.v .core { max-width: 420px; width: 100%; justify-self: center; }
  .panel.v { grid-template-columns: 1fr; gap: var(--space-3); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script>
  // Optional theme override for embeds: ?theme=light or ?theme=dark
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div class="wrap">
  <div class="heads label" id="heads" aria-hidden="true">
    <span>What Lir reads</span><span>Lir</span><span>What your team gets</span>
  </div>

  <div class="graph" id="graph">
    <svg class="wires" id="wires" aria-hidden="true"></svg>

    <div class="col" id="sources" data-label="What Lir reads" role="group" aria-label="Sensors. Select one to see what it covers."></div>

    <div class="core" id="core">
      <h2>Lir</h2>
      <p class="sub">Reads every image alongside your process data</p>
      <ul class="rows" id="rows"></ul>
      <p class="foot">Lir recommends, your operators decide</p>
    </div>

    <div class="col" id="outputs" data-label="What your team gets"></div>
  </div>

  <div class="panel" id="panel" aria-live="polite"></div>
  <p class="hint">Select a sensor to see what it covers.</p>
</div>

<script>
const SENSORS = [
  {
    id: "microscope", name: "Inline microscope", sub: "Images the microbes in your tank",
    tag: "Lir sensor", row: "Microbe images", cls: "lir",
    covers: "The biology in your aeration tank. It samples the tank automatically and captures up to 60,000 images an hour, including the thread-like filamentous bacteria behind bulking.",
    uses: "The images are the basis of each tank’s biological health score and of alerts on early signs of bulking."
  },
  {
    id: "do", name: "Dissolved oxygen", sub: "Oxygen available to the microbes",
    tag: "Your probe", row: "Dissolved oxygen",
    covers: "How much oxygen is dissolved in the tank, which is what the microbes rely on to treat your wastewater.",
    uses: "Lir reads it alongside every image, so changes in the biology are seen in the context of your process."
  },
  {
    id: "nh4", name: "Ammonia", sub: "A sign of how nitrification is going",
    tag: "Your probe", row: "Ammonia",
    covers: "Ammonia levels in the tank, an indicator of how well nitrification is working.",
    uses: "Lir reads it alongside every image, so changes in the biology are seen in the context of your process."
  },
  {
    id: "temp", name: "Temperature", sub: "How fast the microbes work",
    tag: "Your probe", row: "Temperature",
    covers: "Tank temperature, which changes how quickly the microbes grow and work.",
    uses: "Lir reads it alongside every image, so changes in the biology are seen in the context of your process."
  },
  {
    id: "scada", name: "Plant SCADA", sub: "Your control system",
    tag: "Mid-2027", row: "SCADA, from mid-2027", cls: "later",
    covers: "Your plant’s control system and the process data it already records.",
    uses: "Connection to your plant’s SCADA arrives in mid-2027. Until then, Lir works alongside your existing probes."
  }
];

const OUTPUTS = [
  { name: "Health score", sub: "For each tank" },
  { name: "Early alerts", sub: "On early signs of bulking" },
  { name: "Recommendations", sub: "On what to check" },
  { name: "Microscope checks", sub: "At your desk, not in the lab" }
];

const $ = id => document.getElementById(id);
const graph = $("graph"), wires = $("wires"), panel = $("panel");
let selected = "microscope";

SENSORS.forEach(s => {
  const b = document.createElement("button");
  b.className = "src" + (s.cls ? " " + s.cls : "");
  b.dataset.id = s.id;
  b.setAttribute("aria-pressed", "false");
  b.setAttribute("aria-controls", "panel");
  b.innerHTML = `<span><b>${s.name}</b><small>${s.sub}</small></span><span class="tag">${s.tag}</span>`;
  b.addEventListener("click", () => select(selected === s.id ? null : s.id));
  $("sources").appendChild(b);

  const li = document.createElement("li");
  li.dataset.id = s.id;
  if (s.cls === "later") li.className = "later";
  li.innerHTML = `<span>${s.row}</span>`;
  $("rows").appendChild(li);
});

OUTPUTS.forEach(o => {
  const d = document.createElement("div");
  d.className = "out";
  d.innerHTML = `<b>${o.name}</b><small>${o.sub}</small>`;
  $("outputs").appendChild(d);
});

function select(id) {
  selected = id;
  document.querySelectorAll(".src").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
  document.querySelectorAll(".rows li").forEach(li => li.classList.toggle("on", li.dataset.id === id));
  wires.querySelectorAll("path").forEach(p => {
    p.classList.toggle("on", p.dataset.src === id);
    p.classList.toggle("feed", !!id && p.dataset.out === "1");
  });
  const s = SENSORS.find(x => x.id === id);
  panel.innerHTML = s
    ? `<div><h3>${s.name}</h3><div class="kind label">${s.tag}</div></div>
       <div><h4>What it covers</h4><p>${s.covers}</p></div>
       <div><h4>How Lir uses it</h4><p>${s.uses}</p></div>`
    : `<div><h3>Five inputs, one view</h3></div>
       <div><p>Lir combines its own images of your microbes with the process data your plant already collects.</p></div>
       <div><p>Select a sensor to see what it covers.</p></div>`;
}

function curve(x1, y1, x2, y2, vertical) {
  if (vertical) {
    const d = (y2 - y1) / 2;
    return `M${x1},${y1} C${x1},${y1 + d} ${x2},${y2 - d} ${x2},${y2}`;
  }
  const d = (x2 - x1) / 2;
  return `M${x1},${y1} C${x1 + d},${y1} ${x2 - d},${y2} ${x2},${y2}`;
}

function layout() {
  const vertical = graph.clientWidth < 640;
  [graph, $("heads"), panel].forEach(el => el.classList.toggle("v", vertical));

  const g = graph.getBoundingClientRect();
  const r = el => { const b = el.getBoundingClientRect(); return { l: b.left - g.left, r: b.right - g.left, t: b.top - g.top, b: b.bottom - g.top, x: b.left - g.left + b.width / 2, y: b.top - g.top + b.height / 2 }; };
  const core = r($("core"));
  let html = "";

  document.querySelectorAll(".src").forEach(el => {
    const s = r(el), id = el.dataset.id, dashed = el.classList.contains("later") ? "dashed" : "";
    const d = vertical ? curve(s.x, s.b, core.x, core.t, true) : curve(s.r, s.y, core.l, core.y, false);
    html += `<path class="${dashed}" data-src="${id}" d="${d}"/>`;
  });
  document.querySelectorAll(".out").forEach(el => {
    const o = r(el);
    const d = vertical ? curve(core.x, core.b, o.x, o.t, true) : curve(core.r, core.y, o.l, o.y, false);
    html += `<path data-out="1" d="${d}"/>`;
  });
  wires.innerHTML = html;
  select(selected);
}

new ResizeObserver(layout).observe(graph);
if (document.fonts) document.fonts.ready.then(layout);
layout();
</script>
</body>
</html>
