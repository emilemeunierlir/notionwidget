<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Lir reads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  /* Lir design tokens, copied from lir-design-system/tokens/tokens.css (2026-10-30).
     Layout follows Figma "lir_notion-widgets_calculator-and-connectors_2026-11-13".
     Dark is the default. Light follows the OS, or force a theme with ?theme=light / ?theme=dark. */
  :root {
    --bg-canvas: #141719;
    --bg-surface: #25292d;
    --bg-subtle: #30353a;
    --border-default: #394149;
    --border-strong: #5a646d;
    --text-primary: #f2f4fa;
    --text-secondary: #cde6e9;
    --text-muted: #8c979f;

    --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
    --space-6: 24px; --space-16: 64px;
    --radius-md: 8px; --radius-lg: 12px; --radius-full: 999px;

    --font-family: "Mori", "DM Sans", system-ui, sans-serif;
    --font-heading-h1: 500 24px/30px var(--font-family);
    --font-heading-h3: 500 15px/20px var(--font-family);
    --font-body-small: 400 12px/16px var(--font-family);
    --font-label-default: 500 12px/16px var(--font-family);
    --ease-ui: cubic-bezier(0.23, 1, 0.32, 1);
    --duration-fast: 150ms;
    --duration-base: 250ms;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-canvas: #f4f7f5;
      --bg-surface: #ffffff;
      --bg-subtle: #e1f3e6;
      --border-default: #cde6e9;
      --border-strong: #394149;
      --text-primary: #000000;
      --text-secondary: #394149;
      --text-muted: #5f6a73;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg-canvas: #f4f7f5;
    --bg-surface: #ffffff;
    --bg-subtle: #e1f3e6;
    --border-default: #cde6e9;
    --border-strong: #394149;
    --text-primary: #000000;
    --text-secondary: #394149;
    --text-muted: #5f6a73;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  /* Transparent so the widget sits on the Notion page in either Notion theme. */
  html, body { margin: 0; background: transparent; color: var(--text-primary); }
  body {
    font: 400 14px/20px var(--font-family); /* Body/Default */
    padding: var(--space-6) var(--space-4);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 450px; margin: 0 auto; }

  /* Panels: What Lir reads, your server, What operators get */
  .panel { background: var(--bg-subtle); border-radius: var(--radius-lg); padding: var(--space-6); }
  .panel h2 { margin: 0 0 var(--space-6); text-align: center; font: var(--font-heading-h1); letter-spacing: -0.5px; }
  .stack { display: flex; flex-direction: column; gap: var(--space-2); }

  /* Cards */
  .card {
    background: var(--bg-canvas); color: var(--text-primary);
    border: 1px solid var(--border-default); border-radius: var(--radius-md);
    padding: var(--space-3) 14px;
  }
  .card b { display: block; font: var(--font-heading-h3); }
  .card small { display: block; font: var(--font-body-small); color: var(--text-muted); }

  /* Sources: select one to see what it is */
  .src {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-3);
    background: var(--bg-canvas); color: var(--text-primary);
    border: 1px solid var(--border-default); border-radius: var(--radius-md);
    padding: var(--space-3) 14px; min-height: 46px;
    transition: background-color var(--duration-fast) var(--ease-ui), color var(--duration-fast) var(--ease-ui),
      border-color var(--duration-fast) var(--ease-ui);
  }
  .src:hover { border-color: var(--border-strong); }
  .src:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 2px; }
  .src b { display: block; font: var(--font-heading-h3); }
  .src small { display: none; font: var(--font-body-small); margin-top: 2px; }
  /* Selected: inverted (text/primary fill, bg/canvas text) and shows its line */
  .src[aria-pressed="true"] { background: var(--text-primary); color: var(--bg-canvas); border-color: var(--text-primary); }
  .src[aria-pressed="true"] small { display: block; }
  .tag {
    flex: none; white-space: nowrap; padding: 2px var(--space-2); border-radius: var(--radius-full);
    background: var(--bg-surface); color: var(--text-secondary);
    font: var(--font-label-default); letter-spacing: .2px;
  }
  .src[aria-pressed="true"] .tag { color: var(--text-primary); }

  /* Wires */
  .wire { display: block; width: 100%; color: var(--text-primary); overflow: visible; }
  .wire path, .wire line { fill: none; stroke: currentColor; stroke-width: 1; vector-effect: non-scaling-stroke; }
  .wire circle { fill: currentColor; }

  /* your server */
  .server .card { padding: var(--space-6); text-align: center; }
  .server .card b { margin-bottom: var(--space-3); }
  .server img { display: block; width: 100%; max-width: 352px; height: auto; margin: 0 auto; }

  /* What operators get */
  .out { padding: var(--space-3) 14px; border-radius: var(--radius-lg); }
  .out-head { display: flex; align-items: center; gap: 6px; min-height: 24px; }
  .out-head svg { flex: none; width: 24px; height: 24px; color: var(--text-primary); }
  .out small { margin-top: var(--space-3); }
  .out.expandable { padding: 0; }
  .out.expandable > button {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
    padding: var(--space-3) 14px; border-radius: var(--radius-lg);
  }
  .out.expandable > button:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 2px; }
  .out.expandable > button > svg { flex: none; color: var(--text-secondary); transition: transform var(--duration-base) var(--ease-ui); }
  .out.expandable > button[aria-expanded="true"] > svg { transform: rotate(180deg); }
  .out .sub-items { display: flex; flex-direction: column; gap: var(--space-2); padding: 0 14px var(--space-3); }
  .out .sub-items[hidden] { display: none; }
  .out .sub-items div { padding: var(--space-3) 14px; border: 1px solid var(--border-default); border-radius: var(--radius-md);
    background: var(--bg-surface); font: var(--font-heading-h3); }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
<script>
  // Optional theme override for embeds: ?theme=light or ?theme=dark
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div class="wrap">
  <section class="panel" aria-label="What Lir reads">
    <div class="stack" id="sources" role="group" aria-label="Data sources. Select one to see what it is."></div>
  </section>

  <!-- Three sources merge into one line down to your server -->
  <svg class="wire" viewBox="0 0 450 67" preserveAspectRatio="none" height="67" aria-hidden="true">
    <path d="M48 0 V27 Q48 33 54 33 H219 Q225 33 225 39 V67"/>
    <path d="M402 0 V27 Q402 33 396 33 H231 Q225 33 225 39 V67"/>
    <line x1="225" y1="0" x2="225" y2="67"/>
  </svg>

  <section class="panel server">
    <h2>your server</h2>
    <div class="card">
      <b>Lir telegraph</b>
      <img src="lir-telegraph.png" width="352" height="213" alt="The Lir dashboard open on a laptop, showing a plant overview, observations and pinned readings">
    </div>
  </section>

  <svg class="wire" viewBox="0 0 450 67" preserveAspectRatio="none" height="67" aria-hidden="true">
    <line x1="225" y1="0" x2="225" y2="67"/>
  </svg>

  <section class="panel">
    <h2>What operators get</h2>
    <div class="stack">
      <div class="card out expandable">
        <button type="button" aria-expanded="false" aria-controls="bio-items">
          <span class="out-head">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.4771 3.29166C10.959 1.80863 13.0571 1.80863 13.5389 3.29166L14.6597 6.7409C14.8751 7.40413 15.4932 7.85317 16.1906 7.85317H19.8173C21.3766 7.85317 22.025 9.84856 20.7635 10.7651L17.8294 12.8969C17.2652 13.3068 17.0291 14.0333 17.2446 14.6966L18.3653 18.1458C18.8472 19.6288 17.1498 20.862 15.8883 19.9455L12.9542 17.8137C12.39 17.4038 11.626 17.4038 11.0619 17.8137L8.12777 19.9455C6.86624 20.862 5.16885 19.6288 5.65072 18.1458L6.77144 14.6966C6.98694 14.0333 6.75086 13.3068 6.18669 12.8969L3.25259 10.7651C1.99105 9.84856 2.6394 7.85317 4.19874 7.85317H7.82549C8.52285 7.85317 9.1409 7.40413 9.35639 6.7409L10.4771 3.29166Z"/><path d="M15.9437 4.08198C17.2115 3.17415 18.9004 4.41906 18.4083 5.89872L17.2638 9.34014C17.0437 10.0019 17.2748 10.73 17.8361 11.1438L20.7554 13.2958C22.0106 14.221 21.3485 16.2119 19.7892 16.2011L16.1625 16.1761C15.4652 16.1713 14.8441 16.616 14.624 17.2778L13.4795 20.7192C12.9874 22.1989 10.8894 22.1844 10.4178 20.6981L9.32086 17.2412C9.10995 16.5765 8.49501 16.1232 7.79767 16.1184L4.17101 16.0933C2.61171 16.0826 1.97715 14.0828 3.24498 13.1749L6.19372 11.0635C6.76071 10.6575 7.00179 9.93257 6.79088 9.26787L5.69398 5.81098C5.22237 4.32466 6.92822 3.10318 8.1834 4.02843L11.1027 6.18037C11.6641 6.59415 12.428 6.59943 12.995 6.19343L15.9437 4.08198Z"/></svg>
            <b>Biology indicators</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="sub-items" id="bio-items" hidden>
          <div>Proxi SVI</div>
          <div>Proxi SV30</div>
          <div>Microscopy reports</div>
        </div>
      </div>

      <div class="card out">
        <span class="out-head">
          <!-- icon/flag is a 16 px icon; centred in a 24 px box to line up with the others -->
          <svg viewBox="-4 -4 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.75 14.25V1.75M3.75 2.25H12.25L10.25 5.5L12.25 8.75H3.75"/></svg>
          <b>Early alerts</b>
        </span>
        <small>On early signs of process upsets</small>
      </div>

      <div class="card out">
        <span class="out-head">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 16.4445L7.55556 9.77778L12 13.1111L17.5556 4.22223L22 7.55556"/><path d="M2 19.7778H22"/></svg>
          <b>Observations</b>
        </span>
        <small>On how to keep your biology stable</small>
      </div>
    </div>
  </section>
</div>

<script>
const SOURCES = [
  { id: "microscope", name: "Inline microscope", sub: "Images the microbes in your tank", tag: "Lir sensor" },
  { id: "telemetry",  name: "Your telemetry",    sub: "Live readings from your probes",   tag: "OPC-UA" },
  { id: "historian",  name: "Your historian",    sub: "Your plant’s past process data",   tag: "REST" },
];

const sources = document.getElementById("sources");
let selected = "microscope";

SOURCES.forEach(s => {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "src";
  b.dataset.id = s.id;
  b.innerHTML = `<span><b>${s.name}</b><small>${s.sub}</small></span><span class="tag">${s.tag}</span>`;
  b.addEventListener("click", () => select(s.id));
  sources.appendChild(b);
});

function select(id) {
  selected = id;
  sources.querySelectorAll(".src").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.id === id)));
}
select(selected);

// Biology indicators opens to show what it includes.
const bio = document.querySelector(".out.expandable > button");
bio.addEventListener("click", () => {
  const open = bio.getAttribute("aria-expanded") !== "true";
  bio.setAttribute("aria-expanded", String(open));
  document.getElementById("bio-items").hidden = !open;
});
</script>
</body>
</html>
