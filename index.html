<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savings calculator · Lir Labs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
  /* Lir design tokens (lir-design-system/tokens/tokens.css, 2026-10-30).
     Layout follows Figma "lir_notion-widgets_calculator-and-connectors_2026-11-13".
     Dark is the default. Light follows the OS, or force a theme with ?theme=light / ?theme=dark. */
  :root {
    --bg-canvas: #141719;
    --bg-surface: #25292d;
    --bg-subtle: #30353a;
    --border-default: #394149;
    --border-strong: #5a646d;
    --text-primary: #f2f4fa;
    --text-secondary: #cde6e9;
    --text-muted: #8c979f;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-6: 24px;
    --space-8: 32px;
    --space-12: 48px;
    --radius-md: 8px;
    --radius-xl: 20px;
    --radius-full: 999px;

    --font-family: "Mori", "DM Sans", system-ui, sans-serif;
    --font-heading-h1: 500 24px/30px var(--font-family);
    --font-heading-h2: 500 18px/24px var(--font-family);
    --font-heading-h3: 500 15px/20px var(--font-family);
    --font-body-default: 400 14px/20px var(--font-family);
    --font-body-small: 400 12px/16px var(--font-family);
    --font-label-default: 500 12px/16px var(--font-family);
    --font-data-big-number: 300 44px/44px var(--font-family);

    --ease-ui: cubic-bezier(0.23, 1, 0.32, 1);
    --duration-fast: 150ms;
    --duration-base: 250ms;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg-canvas: #f4f7f5;
      --bg-surface: #ffffff;
      --bg-subtle: #e1f3e6;
      --border-default: #cde6e9;
      --border-strong: #394149;
      --text-primary: #000000;
      --text-secondary: #394149;
      --text-muted: #5f6a73;
      color-scheme: light;
    }
  }
  :root[data-theme="light"] {
    --bg-canvas: #f4f7f5;
    --bg-surface: #ffffff;
    --bg-subtle: #e1f3e6;
    --border-default: #cde6e9;
    --border-strong: #394149;
    --text-primary: #000000;
    --text-secondary: #394149;
    --text-muted: #5f6a73;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg-canvas); color: var(--text-primary);
    font: var(--font-body-default);
    -webkit-font-smoothing: antialiased;
  }
  .widget { max-width: 640px; margin: 0 auto; padding: var(--space-6) var(--space-4); }

  /* Inverted surface (selected option, total card): text/primary fill with bg/canvas text,
     so it flips with the theme. */
  .inverted { background: var(--text-primary); color: var(--bg-canvas); }

  /* Header: the title on questions, the intro line on the result */
  h1 { font: var(--font-heading-h1); letter-spacing: -0.5px; margin: 0; }
  .sub { color: var(--text-muted); margin: 0; }
  .header { margin-bottom: var(--space-12); }
  .widget.done .header { margin-bottom: var(--space-6); }
  .widget.done h1, .widget:not(.done) .sub { display: none; }

  /* Progress */
  .progress { display: flex; gap: var(--space-1); margin-bottom: var(--space-12); }
  .widget.done .progress { margin-bottom: var(--space-6); }
  .progress span { flex: 1; height: 4px; border-radius: var(--radius-full); background: var(--bg-subtle);
    transition: background-color var(--duration-base) var(--ease-ui); }
  .progress span.on { background: var(--text-secondary); }

  /* Steps */
  .step { display: none; }
  .step.active { display: block; animation: in var(--duration-base) var(--ease-ui); }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .question { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center;
    gap: var(--space-3); margin-bottom: var(--space-8); }
  .q { font: var(--font-heading-h2); letter-spacing: -0.2px; margin: 0; }
  .hint { margin: 0; padding: 6px var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-xl);
    color: var(--text-muted); }

  /* Unit switch: Filter segmented control (product/components/observations/filter-segmented-control.md) */
  .seg { display: inline-flex; gap: 2px; padding: 3px; border-radius: var(--radius-full); background: var(--bg-surface); }
  .seg button {
    all: unset; cursor: pointer; height: 28px; box-sizing: border-box; padding: 6px var(--space-3);
    border-radius: var(--radius-full); color: var(--text-muted); font: var(--font-label-default); letter-spacing: 0.2px;
    transition: background-color var(--duration-fast) var(--ease-ui), color var(--duration-fast) var(--ease-ui);
  }
  .seg button:hover { color: var(--text-primary); }
  .seg button[aria-pressed="true"] { background: var(--bg-canvas); color: var(--text-primary); }
  .seg button:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 2px; }

  .options { display: grid; gap: var(--space-2); }
  .opt {
    display: flex; align-items: center; gap: var(--space-2);
    width: 100%; text-align: left; padding: var(--space-3) var(--space-4); min-height: 48px;
    background: var(--bg-canvas); color: var(--text-muted);
    border: 1.5px solid var(--border-default); border-radius: var(--radius-md);
    font: var(--font-body-small); cursor: pointer;
    transition: background-color var(--duration-fast) var(--ease-ui), color var(--duration-fast) var(--ease-ui),
      border-color var(--duration-fast) var(--ease-ui);
  }
  .opt:hover { border-color: var(--border-strong); color: var(--text-primary); }
  .opt:focus-visible, .opt.other:focus-within { outline: 2px solid var(--border-strong); outline-offset: 2px; }
  .opt[aria-pressed="true"] { background: var(--text-primary); color: var(--bg-canvas); border-color: var(--text-primary); }
  .opt.other { cursor: text; }
  .opt.other input {
    flex: 1; min-width: 0; border: 0; background: none; color: inherit; font: inherit; padding: 0; outline: none;
    font-variant-numeric: tabular-nums;
  }
  .opt.other input::placeholder { color: var(--text-muted); }
  .opt.other button { all: unset; cursor: pointer; font: var(--font-label-default); letter-spacing: 0.2px; padding: var(--space-1) 0; }
  .opt.other button[hidden] { display: none; }

  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: var(--space-8); min-height: 44px; }
  .count { font: var(--font-label-default); letter-spacing: 0.2px; color: var(--text-muted); font-variant-numeric: tabular-nums; }
  .link { background: none; border: 0; color: var(--text-muted); font: var(--font-label-default); letter-spacing: 0.2px;
    cursor: pointer; padding: var(--space-3) 0; transition: color var(--duration-fast) var(--ease-ui); }
  .link:hover { color: var(--text-primary); }
  .link:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 2px; border-radius: var(--radius-md); }
  .link[hidden] { visibility: hidden; display: inline; }

  /* Result */
  .result > * + * { margin-top: var(--space-3); }
  .breakdown { border: 1.5px solid var(--border-default); border-radius: var(--radius-md); background: var(--bg-canvas); }
  .row { display: flex; justify-content: space-between; gap: var(--space-3); padding: var(--space-4) 18px;
    border-top: 1px solid var(--border-default); font: var(--font-heading-h3); }
  .row:first-child { border-top: 0; }
  .row .amt { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row .amt.none { color: var(--text-muted); }

  .total-card { border-radius: var(--radius-md); padding: var(--space-4) 18px 18px; }
  .total-card .label { font: var(--font-label-default); letter-spacing: 0.2px; margin: 0 0 var(--space-3); }
  .big { font: var(--font-data-big-number); letter-spacing: -1.5px; margin: 0; font-variant-numeric: tabular-nums;
    display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: baseline; column-gap: var(--space-1); row-gap: var(--space-2); }
  .big .n { white-space: nowrap; }
  .big .unit { font: var(--font-heading-h3); letter-spacing: 0; }

  .more { padding-top: var(--space-3); }
  .more > * + * { margin-top: var(--space-6); }

  /* Inputs / Button: Ghost, Medium */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
    height: 36px; padding: 10px var(--space-4); border-radius: 10px; background: none;
    border: 1px solid var(--border-strong); color: var(--text-primary);
    font: var(--font-label-default); letter-spacing: 0.2px; cursor: pointer;
    transition: background-color var(--duration-fast) var(--ease-ui); }
  .btn:hover { background: var(--bg-surface); }
  .btn:active { background: var(--bg-subtle); }
  .btn:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 2px; }
  @media (pointer: coarse) { .btn { min-height: 44px; } }

  /* Disclosure row */
  summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: var(--space-2);
    padding: 7px var(--space-4); border: 1px solid var(--border-default); border-radius: var(--radius-xl);
    color: var(--text-primary); transition: background-color var(--duration-fast) var(--ease-ui); }
  summary::-webkit-details-marker { display: none; }
  summary:hover { background: var(--bg-subtle); }
  summary:focus-visible { outline: 2px solid var(--border-strong); outline-offset: 2px; }
  summary svg { flex: none; color: var(--text-secondary); transition: transform var(--duration-base) var(--ease-ui); }
  details[open] summary svg { transform: rotate(180deg); }
  details ul { margin: var(--space-2) 0 0; padding: var(--space-1) var(--space-4) var(--space-1) 30px;
    color: var(--text-secondary); font: var(--font-body-small); }
  details li { margin-bottom: var(--space-2); }
  details li:last-child { margin-bottom: 0; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  // Notion can't tell an embed its theme, so allow ?theme=light|dark on the embed URL.
  (function () {
    var t = new URLSearchParams(location.search).get("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  })();
</script>
</head>
<body>
<div class="widget" id="widget">
  <div class="header">
    <h1>How much could your plant save?</h1>
    <p class="sub">Answer four quick questions for an estimated yearly savings range.</p>
  </div>

  <div class="progress" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div id="steps"></div>

  <section class="step result" id="result" aria-live="polite">
    <div class="breakdown" id="breakdown"></div>
    <div class="total-card inverted">
      <p class="label">Estimated yearly savings</p>
      <p class="big" id="total"></p>
    </div>
    <div class="more">
      <div><button class="btn" id="restart" type="button">Start over</button></div>
      <details>
        <summary>How we calculated this
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
        </summary>
        <ul id="assumptions"></ul>
      </details>
    </div>
  </section>
</div>

<script>
/* ---------------------------------------------------------------------------
   CONFIG — every number used in the estimate lives here.
   Source notes are on the Notion "Cost saving calculator" page.
   Values marked ASSUMPTION fill a "No data" gap and should be confirmed.
--------------------------------------------------------------------------- */
const CONFIG = {
  // Typical PE range per segment (ASSUMPTION: narrower than the full segment bounds)
  // m3 labels: the same segments in m³/day, converted at m3PerPePerYear (61 / 365 ≈ 0.167 m³/PE/day), rounded.
  plants: {
    medium:    { range: "5,000 – 10,000 PE",    m3: "800 – 1,700 m³/day",       pe: [5000, 10000] },
    large:     { range: "10,000 – 100,000 PE",  m3: "1,700 – 17,000 m³/day",    pe: [20000, 80000] },
    veryLarge: { range: "100,000 – 500,000 PE", m3: "17,000 – 85,000 m³/day",   pe: [100000, 300000] },
    huge:      { range: "> 500,000 PE",         m3: "> 85,000 m³/day",          pe: [500000, 1000000] }, // ASSUMPTION: upper bound
  },
  m3PerPePerYear: 61,              // SE|BS: 18.3M m³ / 300k PE
  // Plant size unit shown first. Industrial sites rarely use PE, so m³/day is the default.
  // Force one in the embed link with ?unit=pe or ?unit=m3.
  defaultUnit: "m3",

  // 1. Automated lab analysis
  microscopyInternal: { hours: 1.5, perYear: 52, wage: [27, 43] },     // process-engineer wage
  microscopyExternal: { price: [120, 320], perYear: 12 },              // Eurawasser low, Biosurf high
  sviTest:            { hours: [0.5, 0.67], perYear: [156, 365], wage: [18, 31] }, // 3×/wk–daily, operator wage

  // 2. Bulking prediction
  bulking: {
    costPerM3: 0.013,                                  // control-dosing cost only (lit.)
    days:   [14, 30],                                  // ASSUMPTION: event duration
    events: { often: [2, 3], sometimes: [1, 1], no: [0, 0], unsure: [0, 1] }, // ASSUMPTION
  },

  // 3. Chemical dosing
  coagulant: {
    kgPerHourPerPe: 28 / 50000,   // Goslar 28 kg/h; ASSUMPTION: Goslar ≈ 50k PE (unconfirmed)
    price: { iron: 0.82, pax: 0.37, alum: 0.82, unsure: 0.82 }, // €/kg; alum price No data → iron used
    reduction: [0.10, 0.20],      // ASSUMPTION: dosing reduction from closed-loop control
  },
};

const QUESTIONS = [
  { id: "size", q: "What size plant do you manage?", units: true, other: true,
    options: Object.entries(CONFIG.plants).map(([v, p]) => ({ v, label: p.range, m3: p.m3 })) },
  { id: "lab", q: "Do you have a lab in-house?", hint: "Where microscopy and sludge tests are done today",
    options: [
      { v: "yes", label: "Yes, we test on site" },
      { v: "no",  label: "No, we send samples to an external lab" },
    ] },
  { id: "upsets", q: "Is your plant suffering from process upsets?", hint: "For example sludge bulking or foaming",
    options: [
      { v: "often",     label: "Yes, regularly" },
      { v: "sometimes", label: "Occasionally" },
      { v: "no",        label: "No" },
      { v: "unsure",    label: "Not sure" },
    ] },
  { id: "coag", q: "Which coagulant do you use?", hint: "For phosphorus removal",
    options: [
      { v: "iron",   label: "Iron (ferric / ferrous)" },
      { v: "pax",    label: "PAX / polyaluminium chloride" },
      { v: "alum",   label: "Alum" },
      { v: "none",   label: "None (biological P removal)" },
      { v: "unsure", label: "Not sure" },
    ] },
];

const answers = {};
let current = 0;
const UNITS = {
  m3: { short: "m³/day", placeholder: "m³ per day", aria: "Other plant size, in m³ per day" },
  pe: { short: "PE",     placeholder: "Number of PE", aria: "Other plant size, in population equivalent (PE)" },
};
const unitParam = new URLSearchParams(location.search).get("unit");
let unit = UNITS[unitParam] ? unitParam : CONFIG.defaultUnit;
const m3DayToPe = m3 => m3 * 365 / CONFIG.m3PerPePerYear;

const fmt = n => n.toLocaleString("en-US");
const eur = n => "€" + fmt(Math.round(n / 100) * 100);
const range = ([a, b]) => a === b ? eur(a) : `${eur(a)} – ${eur(b)}`;
const rangeHtml = ([a, b]) => a === b
  ? `<span class="n">${eur(a)}</span>`
  : `<span class="n">${eur(a)}</span><span>–</span><span class="n">${eur(b)}</span>`;

const plantPe = a => a.size === "other" ? [a.pe, a.pe] : CONFIG.plants[a.size].pe;

function calculate(a) {
  const C = CONFIG, pe = plantPe(a);
  const m3 = pe.map(p => p * C.m3PerPePerYear);
  const lo = 0, hi = 1;

  // 1. Lab analysis
  const svi = [lo, hi].map(i => C.sviTest.hours[i] * C.sviTest.perYear[i] * C.sviTest.wage[i]);
  const micro = a.lab === "yes"
    ? [lo, hi].map(i => C.microscopyInternal.hours * C.microscopyInternal.perYear * C.microscopyInternal.wage[i])
    : [lo, hi].map(i => C.microscopyExternal.price[i] * C.microscopyExternal.perYear);
  const lab = [micro[0] + svi[0], micro[1] + svi[1]];

  // 2. Bulking
  const ev = C.bulking.events[a.upsets];
  const bulk = [lo, hi].map(i => (m3[i] / 365) * C.bulking.days[i] * ev[i] * C.bulking.costPerM3);

  // 3. Chemical dosing
  const chem = a.coag === "none" ? [0, 0] : [lo, hi].map(i =>
    C.coagulant.kgPerHourPerPe * pe[i] * 8760 * C.coagulant.price[a.coag] * C.coagulant.reduction[i]);

  return [
    { name: "Automated lab analysis", val: lab },
    { name: "Bulking prediction", val: bulk },
    { name: "Chemical dosing", val: chem },
  ];
}

function render() {
  const wrap = document.getElementById("steps");
  wrap.innerHTML = QUESTIONS.map((q, i) => `
    <section class="step" data-i="${i}" role="group" aria-labelledby="q${i}">
      <div class="question">
        <p class="q" id="q${i}">${q.q}</p>
        ${q.units
          ? `<div class="seg" role="group" aria-label="Plant size unit">
              <button type="button" data-unit="m3" aria-pressed="${unit === "m3"}">m³/day</button>
              <button type="button" data-unit="pe" aria-pressed="${unit === "pe"}">PE</button>
            </div>`
          : `<p class="hint">${q.hint}</p>`}
      </div>
      <div class="options">
        ${q.options.map(o => `<button type="button" class="opt" data-q="${q.id}" data-v="${o.v}" aria-pressed="false"
          ${o.m3 ? `data-pe="${o.label}" data-m3="${o.m3}"` : ""}>${o.m3 && unit === "m3" ? o.m3 : o.label}</button>`).join("")}
        ${q.other ? `<label class="opt other" data-q="${q.id}" data-v="other" aria-pressed="false">
          <span>Other:</span><input type="text" inputmode="numeric" placeholder="${UNITS[unit].placeholder}" aria-label="${UNITS[unit].aria}">
          <button type="button" hidden>Next →</button></label>` : ""}
      </div>
      <div class="nav"><button type="button" class="link back" ${i === 0 ? "hidden" : ""}>← Back</button><span class="count">${i + 1} of ${QUESTIONS.length}</span></div>
    </section>`).join("");

  const pick = (opt, value) => {
    answers[opt.dataset.q] = value;
    opt.parentElement.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", b === opt));
  };

  // Unit switch: relabels the size options and the Other field. The maths stays in PE.
  const setUnit = u => {
    unit = u;
    wrap.querySelectorAll(".seg button").forEach(b => b.setAttribute("aria-pressed", b.dataset.unit === u));
    wrap.querySelectorAll("button.opt[data-m3]").forEach(b => { b.textContent = u === "m3" ? b.dataset.m3 : b.dataset.pe; });
    const inp = wrap.querySelector(".opt.other input");
    if (inp) { inp.placeholder = UNITS[u].placeholder; inp.setAttribute("aria-label", UNITS[u].aria); }
  };

  wrap.addEventListener("click", e => {
    const seg = e.target.closest(".seg button");
    if (seg) { setUnit(seg.dataset.unit); return; }
    const opt = e.target.closest("button.opt");
    if (opt) { pick(opt, opt.dataset.v); setTimeout(() => go(current + 1), 140); }
    if (e.target.closest(".back")) go(current - 1);
  });

  // "Other" size: type a PE number, then Enter or Next.
  const other = wrap.querySelector(".opt.other");
  if (other) {
    const input = other.querySelector("input"), next = other.querySelector("button");
    const value = () => parseInt(input.value.replace(/[^\d]/g, ""), 10);
    const submit = () => {
      const n = value();
      if (!(n > 0)) { input.focus(); return; }
      answers.otherValue = n; answers.otherUnit = unit;
      answers.pe = unit === "m3" ? Math.round(m3DayToPe(n)) : n;
      pick(other, "other"); go(current + 1);
    };
    input.addEventListener("input", () => { next.hidden = !(value() > 0); });
    input.addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
    next.addEventListener("click", submit);
  }

  document.getElementById("restart").addEventListener("click", () => {
    Object.keys(answers).forEach(k => delete answers[k]);
    document.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-pressed", "false"));
    if (other) { other.querySelector("input").value = ""; other.querySelector("button").hidden = true; }
    go(0);
  });
  go(0);
}

function go(i) {
  current = Math.max(0, Math.min(i, QUESTIONS.length));
  const done = current === QUESTIONS.length;
  document.getElementById("widget").classList.toggle("done", done);
  document.querySelectorAll(".step").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".progress span").forEach((s, k) => s.classList.toggle("on", k < current || done));
  if (!done) {
    const s = document.querySelector(`.step[data-i="${current}"]`);
    s.classList.add("active");
    (s.querySelector('button.opt[aria-pressed="true"]') || s.querySelector("button.opt")).focus({ preventScroll: true });
  } else showResult();
}

function showResult() {
  const parts = calculate(answers);
  const total = [0, 1].map(i => parts.reduce((s, p) => s + p.val[i], 0));
  document.getElementById("total").innerHTML = `${rangeHtml(total)} <span class="unit">/ year</span>`;
  document.getElementById("breakdown").innerHTML = parts.map(p => `
    <div class="row"><span>${p.name}</span><span class="amt${p.val[1] ? "" : " none"}">${p.val[1] ? range(p.val) : "—"}</span></div>`).join("");

  const C = CONFIG, pe = plantPe(answers);
  const peText = pe[0] === pe[1] ? `${fmt(pe[0])} PE` : `${fmt(pe[0])}–${fmt(pe[1])} PE`;
  const m3Day = pe.map(p => Math.round(p * C.m3PerPePerYear / 365));
  const m3Text = answers.size === "other" && answers.otherUnit === "m3" ? `${fmt(answers.otherValue)} m³/day`
    : m3Day[0] === m3Day[1] ? `${fmt(m3Day[0])} m³/day` : `${fmt(m3Day[0])}–${fmt(m3Day[1])} m³/day`;
  document.getElementById("assumptions").innerHTML = [
    unit === "m3"
      ? `Plant size: ${m3Text}, counted as ${peText} at ${C.m3PerPePerYear} m³ treated per PE per year.`
      : `Plant size: ${peText}, about ${C.m3PerPePerYear} m³ treated per PE per year.`,
    answers.lab === "yes"
      ? `Microscopy: ${C.microscopyInternal.hours} h per analysis, weekly, at €${C.microscopyInternal.wage[0]}–${C.microscopyInternal.wage[1]}/h.`
      : `Microscopy: external lab at €${C.microscopyExternal.price[0]}–${C.microscopyExternal.price[1]} per analysis, monthly.`,
    `SVI / SV30: 30–40 min per test, 3×/week to daily, at €${C.sviTest.wage[0]}–${C.sviTest.wage[1]}/h operator time.`,
    `Bulking: €${C.bulking.costPerM3}/m³ treated during an event, ${C.bulking.days[0]}–${C.bulking.days[1]} days per event. This is the cost of controlling bulking only, so the real cost is likely higher.`,
    answers.coag === "none" ? "Chemical dosing: not included."
      : `Coagulant: dose scaled from a reference plant (28 kg/h), priced at €${C.coagulant.price[answers.coag]}/kg, with a ${C.coagulant.reduction[0]*100}–${C.coagulant.reduction[1]*100}% reduction.`,
    "Data-logging time savings are not included.",
  ].map(t => `<li>${t}</li>`).join("");

  document.getElementById("result").classList.add("active");
}

render();
</script>
</body>
</html>
